services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_NAME: iCloudEMS-ERP
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: icloudems
      DB_USERNAME: erp_user
      DB_PASSWORD: erp_local_password
      REDIS_HOST: redis
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: icloudems
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: erp_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      MODEL_NAME: distilbert-sentiment-lite
    ports:
      - "8000:8000"

volumes:
  mysql_data:
